name: Offline editor

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: EditorWeb/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: EditorWeb
      - run: npm test
        working-directory: EditorWeb
      - run: python3 scripts/check-editor-bundle.py
